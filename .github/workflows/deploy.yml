name: Deploy EdTech

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projeto-Rafael-el-el-el/prototipo/package-lock.json

      - name: Compilar aplicação
        working-directory: Projeto-Rafael-el-el-el/prototipo
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Projeto-Rafael-el-el-el/prototipo/dist

      - id: deployment
        uses: actions/deploy-pages@v4